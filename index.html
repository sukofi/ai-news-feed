<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ai-news-feed</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1c1e;
        --muted: #5b5f66;
        --line: #dcdfe4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --fg: #eceef1;
          --muted: #a3a9b3;
          --line: #333941;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        font-size: 16px;
        line-height: 1.8;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p.lead {
        color: var(--muted);
        margin: 0 0 2rem;
      }
      ol {
        padding-left: 1.4rem;
        margin: 0;
      }
      li {
        margin-bottom: 1.25rem;
      }
      .title {
        font-weight: 600;
      }
      .source {
        color: var(--muted);
        font-size: 0.875rem;
      }
      a {
        color: inherit;
      }
      footer {
        margin-top: 3rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.875rem;
      }
      code {
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ai-news-feed</h1>
      <p class="lead">
        アプリ「AIニュース5」の配信先です。中身の正本は
        <code>articles.json</code> のほう。このページは配信が生きているか
        目で確かめるためだけに置いています。
      </p>
      <div id="status">読みこみ中…</div>
      <ol id="list"></ol>
      <footer>
        <a href="./articles.json">articles.json</a>
      </footer>
    </main>
    <script>
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("list");

      fetch("./articles.json", { cache: "no-cache" })
        .then((response) => {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .then((payload) => {
          const articles = Array.isArray(payload.articles) ? payload.articles : [];
          statusEl.textContent = `${payload.generatedAt ?? "日付不明"} の${articles.length}本`;
          for (const article of articles) {
            const item = document.createElement("li");

            const title = document.createElement("div");
            title.className = "title";
            title.textContent = article.title ?? "";
            item.appendChild(title);

            const source = document.createElement("div");
            source.className = "source";
            source.textContent = article.source?.name ?? "";
            item.appendChild(source);

            listEl.appendChild(item);
          }
        })
        .catch((error) => {
          statusEl.textContent = "articles.json を読めませんでした（" + error.message + "）";
        });
    </script>
  </body>
</html>
